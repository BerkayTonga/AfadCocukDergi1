        // PDF.js worker'ını hemen ayarla (script yüklendikten sonra)

    <script>

        let currentPdf = null;
        let totalPages = 0;
        let currentPage = 1;
        let isMobile = window.innerWidth <= 1024;
        const renderingPages = new Set();
        const MAX_RENDER_ATTEMPTS = 3;

        // Detect Safari (WebKit) to apply safer defaults
        const ua = navigator.userAgent || '';
        const isSafariBrowser = /Safari/.test(ua) && !/Chrome|Chromium|Edge|OPR|Brave/.test(ua);
        // Disable WebGL rendering on Safari to avoid GPU driver crashes
        const USE_WEBGL_FOR_RENDER = !isSafariBrowser;

        // Device capability detection for low-end throttling
        const deviceMemory = navigator.deviceMemory || 4; // GB, undefined on some browsers
        const hwConcurrency = navigator.hardwareConcurrency || 4; // logical cores
        const isLowEndDevice = (deviceMemory <= 1.5) || (hwConcurrency <= 2) || (window.innerWidth <= 768);

        // Limit concurrent renders to avoid memory/CPU spikes (especially on low-end devices)
        let MAX_CONCURRENT_RENDER = isLowEndDevice ? 1 : 3;

        // Default DPR cap (can be lowered for low-end or Safari)
        const DPR_CAP_DEFAULT = isLowEndDevice ? 1 : (isSafariBrowser ? 1 : 2);
        
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
        
        // Ses efektleri için
        let pageFlipSound = null;
        let loadingSound = null;
        let isMusicPlaying = false;
        let musicStopped = false;

        // Kullanıcı etkileşiminde müziği başlat (DOMContentLoaded içinde de ekleniyor)
        
        // Sayfa kapanırken müzik durumunu sıfırla (F5 için)
        window.addEventListener('beforeunload', function() {
            if (loadingSound) {
                loadingSound.pause();
                loadingSound.currentTime = 0;
            }
            isMusicPlaying = false;
            // musicStopped'ı sıfırlama - sayfa yenilendiğinde sıfırlanacak
        });
        
        // Sayfa yüklendiğinde otomatik başlat
        document.addEventListener('DOMContentLoaded', function() {
            // Müzik durumunu sıfırla (F5 için)
            isMusicPlaying = false;
            musicStopped = false;
            
            loadPageFlipSound();
            loadLoadingSound();
            
            // Kullanıcı etkileşiminde müziği başlat
            ['click', 'touchstart', 'keydown'].forEach(eventType => {
                document.addEventListener(eventType, startLoadingMusic, { once: true });
            });
            
            loadPDF();
            
            // 15 saniye sonra sabır mesajı göster
            setTimeout(() => {
                const loadingScreen = document.getElementById('loadingScreen');
                if (loadingScreen && loadingScreen.style.display !== 'none') {
                    const loadingContent = document.querySelector('.loading-content h2');
                    if (loadingContent) {
                        loadingContent.textContent = 'Dergi Yükleniyor...';
                        const loadingText = document.createElement('p');
                        loadingText.style.marginTop = '10px';
                        loadingText.style.fontSize = '14px';
                        loadingText.style.color = '#666';
                        loadingText.textContent = 'İnternet hızınıza göre yükleme sürebilir. Lütfen bekleyin...';
                        loadingContent.parentNode.appendChild(loadingText);
                    }
                }
            }, 15000);
        });
        
        // Sayfa çevirme sesini yükle
        function loadPageFlipSound() {
            pageFlipSound = new Audio('sounds/page_flip.mp3');
            pageFlipSound.preload = 'auto';
            pageFlipSound.volume = 0.5; // Ses seviyesini ayarla
        }
        
        // Yükleme müziğini yükle
        function loadLoadingSound() {
            loadingSound = new Audio('sounds/loading.mp3');
            loadingSound.preload = 'auto';
            loadingSound.loop = true;
            loadingSound.volume = 0.5;
        }
        
        // Yükleme müziğini başlat
        function startLoadingMusic() {
            if (!loadingSound || isMusicPlaying || musicStopped) return;
            loadingSound.currentTime = 0;
            loadingSound.play().then(() => {
                isMusicPlaying = true;
            }).catch(() => {});
        }
        
        // fadeInMusic fonksiyonu kaldırıldı - direkt başlıyor
        
        // Ses seviyesini yavaşça azalt (fade out)
        function fadeOutMusic() {
            if (!loadingSound) return;
            
            const fadeDuration = 1500; // 1.5 saniye
            const steps = 30; // 30 adım
            const stepDuration = fadeDuration / steps;
            const currentVolume = loadingSound.volume;
            const volumeStep = currentVolume / steps;
            
            let currentStep = 0;
            
            const fadeInterval = setInterval(() => {
                currentStep++;
                loadingSound.volume = Math.max(currentVolume - (volumeStep * currentStep), 0);
                
                if (currentStep >= steps) {
                    clearInterval(fadeInterval);
                    // Müziği tamamen durdur
                    stopLoadingMusic();
                }
            }, stepDuration);
        }
        
        // Yükleme müziğini durdur
        function stopLoadingMusic() {
            if (loadingSound) {
                loadingSound.pause();
                loadingSound.currentTime = 0;
                isMusicPlaying = false;
                musicStopped = true; // Müzik durduruldu, tekrar başlatma
            }
        }
        
        // Sayfa çevirme sesini çal
        function playPageFlipSound() {
            if (pageFlipSound) {
                pageFlipSound.currentTime = 0; // Sesi başa al
                pageFlipSound.play().catch(() => {});
            }
        }

        // Ekran boyutuna göre flipbook boyutlarını hesapla
        function getFlipbookDimensions() {
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            
            // A4 aspect ratio: mobil/tablet için tek sayfa (1.414), desktop için çift sayfa (1/1.414)
            const isMobile = vw <= 1024;
            const a4Ratio = isMobile ? 1.414 : (1 / 1.414);

            // Target container widths by breakpoint
            let targetWidth;
            if (vw <= 320) targetWidth = Math.min(300, vw);
            else if (vw <= 480) targetWidth = Math.min(400, Math.floor(vw * 0.98));
            else if (vw <= 768) targetWidth = Math.min(600, Math.floor(vw * 0.95));
            else if (vw <= 1024) targetWidth = Math.min(800, Math.floor(vw * 0.9));
            else targetWidth = 1200;

            // Compute height from width using A4 aspect ratio
            // Mobil/tablet: tek sayfa (yükseklik = genişlik * 1.414)
            // Desktop: çift sayfa (yükseklik = genişlik / 1.414)
            let targetHeight = Math.floor(targetWidth * a4Ratio);

            // Ensure it fits viewport height (leave space for controls ~100px)
            const maxUsableHeight = vh - 120;
            if (targetHeight > maxUsableHeight) {
                targetHeight = Math.max(200, maxUsableHeight);
                targetWidth = Math.floor(targetHeight / a4Ratio);
            }

            return { width: targetWidth, height: targetHeight };
        }

        // PDF dosyasını yükle
        async function loadPDF() {
            try {
                startLoadingMusic();
                
                if (typeof pdfjsLib === 'undefined') {
                    throw new Error('PDF.js kütüphanesi yüklenemedi.');
                }
                
                const pdf = await pdfjsLib.getDocument({
                    url: 'afad_dergi.pdf',
                    cMapUrl: 'libs/pdfjs/cmaps/',
                    cMapPacked: true,
                    standardFontDataUrl: 'libs/pdfjs/standard_fonts/'
                }).promise;
                
                currentPdf = pdf;
                totalPages = pdf.numPages;
                
                // İlk 3 sayfayı yükle ve Turn.js'i başlat
                await loadEntireMagazine();
                
                // Turn.js'i başlat
                const dims = getFlipbookDimensions();
                $("#flipbook").turn({
                    width: dims.width,
                    height: dims.height,
                    autoCenter: false,
                    acceleration: true,
                    elevation: 30,
                    gradients: true,
                    display: isMobile ? 'single' : 'double',
                    when: {
                        turning: function(event, page, view) {
                            currentPage = page;
                            updateNavigationButtons();
                            playPageFlipSound();
                        },
                        zooming: function(event, zoom, page) {
                            updateCanvasQuality();
                        }
                    }
                });
                
                updateNavigationButtons();
                $("#flipbook").css('margin-left', '0');
                
                // Dergiyi göster
                const loadingScreen = document.getElementById('loadingScreen');
                const flipbook = document.getElementById('flipbook');
                if (loadingScreen) loadingScreen.style.display = 'none';
                if (flipbook) flipbook.style.display = 'block';
                
                fadeOutMusic();
                
            } catch (error) {
                fadeOutMusic();
                document.getElementById('loadingScreen').innerHTML = `
                    <div class="loading-content">
                        <h2>Hata Oluştu</h2>
                        <p>PDF dosyası yüklenirken hata oluştu.</p>
                        <button onclick="location.reload()" style="padding: 10px 20px; background: #FF8A00; color: white; border: none; border-radius: 5px; cursor: pointer;">Tekrar Dene</button>
                    </div>
                `;
            }
        }

        // createBookPages fonksiyonu kaldırıldı - loadEntireMagazine tüm işi yapıyor

        // Modern overlay modal ekleme fonksiyonu
        function addActivityModal(pageElement, title, description, buttonText, targetUrl, imageSrc = 'img/bk_baslik.png') {
            // Overlay oluştur
            const overlay = document.createElement('div');
            overlay.className = 'activity-overlay';
            
            // Modal içeriği
            overlay.innerHTML = `
                <div class="activity-modal">
                    <h3><img src="${imageSrc}" alt="${title}"></h3>
                    <button class="activity-button">${buttonText}</button>
                </div>
            `;
            
            // Buton tıklama olayı
            const button = overlay.querySelector('.activity-button');
            button.addEventListener('click', function() {
                const w = window.screen && window.screen.availWidth ? window.screen.availWidth : window.innerWidth;
                const h = window.screen && window.screen.availHeight ? window.screen.availHeight : window.innerHeight;
                const features = `width=${w},height=${h},left=0,top=0,scrollbars=yes,resizable=yes`;
                const win = window.open(targetUrl, '_blank', features);
                if (win && typeof win.moveTo === 'function' && typeof win.resizeTo === 'function') {
                    try { win.moveTo(0, 0); win.resizeTo(w, h); } catch (e) {}
                }
            });
            
            // Sayfa elementine ekle
            pageElement.appendChild(overlay);
            
            // Modal'ı göster
            setTimeout(() => {
                overlay.classList.add('show');
            }, 100);
        }

        // Sayfa içeriğini yükle (yüksek kalite)
        async function loadPageContent(pageNumber, pageElement, isBackground = false, attempt = 1) {
            const status = pageElement.dataset.status;
            if (status === 'rendering' || status === 'loaded') return;
            if (pageElement.querySelector('canvas') || renderingPages.has(pageNumber)) return;
            
            pageElement.dataset.status = 'rendering';
            renderingPages.add(pageNumber);
            
            try {
                const page = await currentPdf.getPage(pageNumber);
                const dims = getFlipbookDimensions();
                const viewport = page.getViewport({ scale: 1.0 });
                const baseScale = Math.min(dims.width / viewport.width, dims.height / viewport.height);
                const qualityScale = Math.max(baseScale, isBackground ? 1.05 : 1.2);
                const finalViewport = page.getViewport({ scale: qualityScale });
                
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                // Cap DPR based on device capabilities to avoid extremely large canvases
                const rawDpr = window.devicePixelRatio || 1;
                const dpr = Math.min(rawDpr, DPR_CAP_DEFAULT);
                
                canvas.height = finalViewport.height * dpr;
                canvas.width = finalViewport.width * dpr;
                canvas.style.width = '100%';
                canvas.style.height = isMobile ? 'auto' : '100%';
                canvas.style.display = 'block';
                ctx.scale(dpr, dpr);
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                
                await page.render({
                    canvasContext: ctx,
                    viewport: finalViewport,
                    enableWebGL: USE_WEBGL_FOR_RENDER,
                    renderInteractiveForms: false
                }).promise;
                
                pageElement.innerHTML = '';
                pageElement.appendChild(canvas);
                
                // Mobil/tablet için arka sayfaya aynı sayfanın kopyasını ekle
                if (isMobile) {
                    const backCanvas = document.createElement('canvas');
                    backCanvas.width = canvas.width;
                    backCanvas.height = canvas.height;
                    const backCtx = backCanvas.getContext('2d');
                    backCtx.drawImage(canvas, 0, 0);
                    backCanvas.style.transform = 'scaleX(-1)'; // Yatay olarak çevir
                    backCanvas.style.position = 'absolute';
                    backCanvas.style.top = '0';
                    backCanvas.style.left = '0';
                    backCanvas.style.width = '100%';
                    backCanvas.style.height = '100%';
                    backCanvas.style.zIndex = '-1';
                    backCanvas.style.pointerEvents = 'none';
                    pageElement.appendChild(backCanvas);
                }
                
                // Modal ekle
                if (pageNumber === 19) addActivityModal(pageElement, 'Resfebe', '', 'Etkinliğe git', 'resfebe.html', 'img/rf_baslik.PNG');
                if (pageNumber === 23) addActivityModal(pageElement, 'Bilgisayarsız Kodlama', '', 'Etkinliğe git', 'bilgisayarsiz_kodlama.html');
                if (pageNumber === 25) addActivityModal(pageElement, 'Cengel Bulmaca', '', 'Etkinliğe git', 'cengel_bulmaca.html', 'img/cb_baslik.png');
                if (pageNumber === 29) addActivityModal(pageElement, 'Tahliye Planı', '', 'Etkinliğe git', 'tahliye_plani.html', 'img/tp_baslik.png');
                
                pageElement.dataset.status = 'loaded';
                
            } catch (error) {
                if (attempt < MAX_RENDER_ATTEMPTS) {
                    renderingPages.delete(pageNumber);
                    pageElement.dataset.status = 'idle';
                    await sleep(600 * attempt);
                    return loadPageContent(pageNumber, pageElement, isBackground, attempt + 1);
                }
                
                pageElement.innerHTML = `
                    <div class="loading error">
                        <div>Sayfa yüklenemedi</div>
                        <button class="retry-btn">Tekrar Dene</button>
                    </div>
                `;
                
                const retryBtn = pageElement.querySelector('.retry-btn');
                if (retryBtn) {
                    retryBtn.addEventListener('click', () => {
                        pageElement.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
                        pageElement.dataset.status = 'idle';
                        loadPageContent(pageNumber, pageElement, isBackground, 1);
                    });
                }
                
                pageElement.dataset.status = 'error';
            } finally {
                renderingPages.delete(pageNumber);
                if (pageElement.dataset.status === 'rendering') {
                    pageElement.dataset.status = 'idle';
                }
            }
        }

        // Lazy loading kaldırıldı - tüm sayfalar önceden yüklü

        // TÜM DERGİYİ YÜKLE - OPTİMİZE EDİLMİŞ
        async function loadEntireMagazine() {
            const flipbook = document.getElementById('flipbook');
            let loadedCount = 0;
            
            // Progress bar güncelle
            function updateProgress() {
                loadedCount++;
                const percent = Math.round((loadedCount / totalPages) * 100);
                const progressFill = document.getElementById('progressFill');
                if (progressFill) progressFill.style.width = percent + '%';
                if (percent >= 100 && loadingSound && isMusicPlaying && !musicStopped) {
                    fadeOutMusic();
                }
            }
            
            // Sayfa oluştur
            function createPageElement(i) {
                const pageEl = document.createElement('div');
                pageEl.className = 'page';
                pageEl.setAttribute('data-page', i);
                pageEl.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
                flipbook.appendChild(pageEl);
                return pageEl;
            }
            
            // İlk 3 sayfayı öncelikli yükle
            for (let i = 1; i <= Math.min(3, totalPages); i++) {
                const pageEl = createPageElement(i);
                await loadPageContent(i, pageEl, false);
                updateProgress();
            }
            
            // Diğer sayfaları sınırlı eşzamanlılık ile yükle (tarayıcı çökmesini önlemek için)
            if (totalPages > 3) {
                const queue = [];
                for (let i = 4; i <= totalPages; i++) {
                    const pageEl = createPageElement(i);
                    queue.push({ num: i, el: pageEl });
                }

                const workers = [];
                for (let w = 0; w < Math.min(MAX_CONCURRENT_RENDER, queue.length); w++) {
                    workers.push((async function worker() {
                        while (queue.length) {
                            const job = queue.shift();
                            try {
                                await loadPageContent(job.num, job.el, true);
                            } catch (e) {
                                // hata yut
                            }
                            updateProgress();
                            // Cihaz zayıfsa daha uzun bekle, aksi halde kısa bir nefes ver
                            await sleep(isLowEndDevice ? 300 : 50);
                        }
                    })());
                }

                await Promise.all(workers);
            }
        }
        


        // Canvas kalitesini güncelle (optimize edilmiş)
        function updateCanvasQuality() {
            const canvases = document.querySelectorAll('.page canvas');
            canvases.forEach(canvas => {
                // Sabit kalite ayarları - hover etkilerini kaldır
                canvas.style.imageRendering = 'auto';
                canvas.style.filter = 'none';
            });
        }

        // Navigasyon fonksiyonları
        function navigatePage(direction) {
            const book = $("#flipbook");
            if (direction === -1) {
                book.turn('previous');
            } else if (direction === 1) {
                book.turn('next');
            }
            playPageFlipSound();
        }

        function updateNavigationButtons() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = currentPage === totalPages;
        }


        // Event listeners
        document.getElementById('prevBtn').addEventListener('click', () => navigatePage(-1));
        document.getElementById('nextBtn').addEventListener('click', () => navigatePage(1));
        
        

        // Klavye kontrolleri
        document.addEventListener('keydown', function(event) {
            switch(event.key) {
                case 'ArrowLeft':
                    event.preventDefault();
                    navigatePage(-1);
                    break;
                case 'ArrowRight':
                    event.preventDefault();
                    navigatePage(1);
                    break;
                case '+':
                case '=':
                    event.preventDefault();
                    $("#flipbook").turn('zoom', 1.5);
                    updateCanvasQuality();
                    break;
                case '-':
                    event.preventDefault();
                    $("#flipbook").turn('zoom', 0.8);
                    updateCanvasQuality();
                    break;
                case '0':
                    event.preventDefault();
                    $("#flipbook").turn('zoom', 1);
                    updateCanvasQuality();
                    break;
            }
        });

        // Pencere boyutu değiştiğinde yeniden boyutlandır
        let resizeTimeout;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(function() {
                const newIsMobile = window.innerWidth <= 1024;
                if (newIsMobile !== isMobile) {
                    isMobile = newIsMobile;
                    location.reload(); // Display mode değiştiğinde sayfayı yenile
                } else {
                    const dimensions = getFlipbookDimensions();
                    const book = $("#flipbook");
                    book.turn('display', isMobile ? 'single' : 'double');
                    book.turn('size', dimensions.width, dimensions.height);
                    // Olası inline margin'i temizle
                    book.css('margin-left', '0');
                }
            }, 250);
        });
    </script>
